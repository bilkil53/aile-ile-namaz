name: Bağımlılık taraması (OSV)

# pubspec.lock'taki paket sürümlerini bilinen açık veritabanıyla (OSV) karşılaştırır.
# Yalnızca okur; APK derlemez, yayın yapmaz. Kilit dosyası değişince ve her hafta çalışır
# (yeni açıklar kodu değiştirmesek de çıkabilir). Açık bulunursa iş kırmızı olur (fail-closed).
on:
  push:
    branches: [main]
    paths: ['pubspec.lock', 'pubspec.yaml', '.github/workflows/dependency-scan.yml']
  pull_request:
    paths: ['pubspec.lock', 'pubspec.yaml']
  # Haftalık sıra (pazar 06:00'dan itibaren): önceki iş bitince başlar (zamanlanmış/elle zincir; push ve PR çalışmaları zinciri başlatmaz)
  workflow_run:
    workflows: ["Eskileri temizle (son 2 sürüm kalır)"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  osv:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion != 'skipped' && contains(fromJSON('["schedule","workflow_dispatch","workflow_run"]'), github.event.workflow_run.event))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bağımlılık açık taraması (osv-scanner)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/google/osv-scanner:v1.9.2 \
            --lockfile=/repo/pubspec.lock \
            || { echo "::error::pubspec.lock içinde bilinen açığı olan paket var. Yukarıdaki listeye bakıp paketi güncelleyin."; exit 1; }
