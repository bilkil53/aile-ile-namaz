# Özel depo (aile-ile-namaz-dev-and-admin) her yeşil derlemede APK'yı herkese açık ana depoya geçici ön sürüm
# olarak koyar (GitHub girişi olmadan indirmek için): yönetim 'yonetim-gecici', demo 'v11.N' (başlıkta "(geçici)").
# Bu iş her gün 23:53'te (Türkiye) tüm geçici kopyaları siler. Kalıcı kopyalar özel depoda. Yalnız ana depoda çalışır.
name: Geçici APK'ları sil (her gün 23:53)

on:
  schedule:
    - cron: '53 20 * * *' # her gün 23:53 Türkiye (UTC 20:53); GitHub zamanlaması birkaç dakika gecikebilir
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sil:
    if: github.repository == 'bilkil53/aile-ile-namaz'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Tüm geçici kopyaları sil
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          # Yönetim kopyası
          if gh release view yonetim-gecici --repo "$R" >/dev/null 2>&1; then
            gh release delete yonetim-gecici --repo "$R" --cleanup-tag -y && echo "Yönetim kopyası silindi." | tee -a "$GITHUB_STEP_SUMMARY"
          else echo "Geçici yönetim kopyası yok."; fi
          # Demo kopyaları: yalnız ön sürüm + başlığında "(geçici)" olanlar (eski kalıcı demo yayınlarına dokunulmaz)
          gh release list --repo "$R" --limit 100 --json tagName,name,isPrerelease \
            --jq '.[] | select(.isPrerelease and (.name | endswith("(geçici)"))) | .tagName' > demo.txt
          while read -r tag; do
            gh release delete "$tag" --repo "$R" --cleanup-tag -y && echo "Demo kopyası $tag silindi." | tee -a "$GITHUB_STEP_SUMMARY"
          done < demo.txt
          [ -s demo.txt ] || echo "Geçici demo kopyası yok."
