name: Yönetim uygulaması (analiz + APK)

# Yalnız admin_app/ değişince çalışır. Yayın yapmaz; APK'yı çalışmanın çıktısı olarak bırakır.
# Adres ve anahtar GitHub secret'larından (YONETIM_SUPABASE_URL, YONETIM_SUPABASE_ANON_KEY) verilir;
# yoksa yalnız analiz yapılır.
on:
  push:
    paths: ['admin_app/**', '.github/workflows/admin-app.yml']

permissions:
  contents: read

jobs:
  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: admin_app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - name: Android iskeleti (depoda tutulmaz)
        run: flutter create --platforms=android --project-name aile_namaz_yonetim --org com.example.yonetim .
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - name: APK
        env:
          URL: ${{ secrets.YONETIM_SUPABASE_URL }}
          KEY: ${{ secrets.YONETIM_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Secret yok: APK atlandı"; exit 0; fi
          flutter build apk --debug --dart-define=SUPABASE_URL="$URL" --dart-define=SUPABASE_ANON_KEY="$KEY"
      - uses: actions/upload-artifact@v4
        if: hashFiles('admin_app/build/app/outputs/flutter-apk/app-debug.apk') != ''
        with:
          name: yonetim-apk
          path: admin_app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 3
