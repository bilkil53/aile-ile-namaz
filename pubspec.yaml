name: aile_ile_namaz
description: Aile ile Namaz - aile havuzu ile namaz takibi
publish_to: 'none'
# Sürüm adı/numarası CI'da --build-name / --build-number ile verilir (README: Sürümleme); bu değer kullanılmaz.
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  google_sign_in: ^7.2.0
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.0
  share_plus: ^13.3.1
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  in_app_update: ^5.0.0
  open_filex: ^4.6.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  geolocator: ^14.1.2
  geocoding: ^5.0.1
  sensors_plus: ^7.1.1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  crypto: ^3.0.6
  intl: any # flutter_localizations sabit bir intl sürümü ister
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
