# Sızıntı taraması (gitleaks): varsayılan kurallar + bilerek açık olan istemci değerleri.
# Aşağıdakiler gizli DEĞİLDİR: Firebase Android API anahtarları APK'nın içinde de bulunur;
# güvenlik Firebase API kısıtlamaları ve Supabase RLS ile sağlanır. Yeni bir istisna eklerken
# yalnızca tam değeri yazın (dosya ya da kural toptan susturulmaz).
[extend]
useDefault = true

[allowlist]
description = "Herkese açık istemci değerleri (Firebase Android API anahtarları, Supabase herkese açık anahtarları, test örneği)"
