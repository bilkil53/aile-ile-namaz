  '''AIzaSyAN2lEI-gh97nI9RMp1gkRpthTBsUHn4sQ''',
  '''AIzaSyBm3uVMo7YDYG9blkgBEKiuAVjpcuyhewU''',
  # Supabase "publishable" anahtarları (gerçek ve eski demo): gizli değil, RLS ile korunur. Eski değerler geçmiş commit'lerde kaldığı için (gitleaks tüm geçmişi tarar) listede durur
  '''sb_publishable_ecpaSUNve-SlWZ1Vk6XRkA_R40sbBvf''',
  '''sb_publishable_YqK0-mpeB4KVFDk97QUCEQ_CUVEKJBp''',
